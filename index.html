<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<meta name="description" content="Minimal Weather App">
<title>Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font:system-ui,sans-serif}
  body{min-height:100vh;background:#f5f5f5;color:#202124;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{font-size:1.5rem;font-weight:400;margin-bottom:16px}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:24px;width:100%;max-width:400px}
  .search{display:flex;gap:8px;margin-bottom:24px}
  input[type=text]{flex:1;padding:12px 16px;border:1px solid #dadce0;border-radius:8px;font-size:1rem;outline:none}
  input[type=text]:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.2)}
  button{padding:12px 24px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .current{text-align:center}
  .temp{font-size:4rem;font-weight:300;line-height:1}
  .desc{text-transform:capitalize;color:#5f6368;margin:8px 0 16px}
  .meta{display:flex;justify-content:center;gap:24px;color:#5f6368;font-size:.9rem}
  .forecast{margin-top:24px}
  .forecast h2{font-size:1rem;font-weight:500;margin-bottom:12px;color:#5f6368}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
  .day{flex:0 0 72px;background:#f8f9fa;border-radius:8px;padding:12px 8px;text-align:center;scroll-snap-align:start}
  .day-name{font-weight:500;font-size:.85rem}
  .day-icon{width:48px;height:48px;margin:8px auto}
  .day-temp{display:flex;justify-content:center;gap:8px;font-size:.9rem}
  .day-high{font-weight:500}
  .day-low{color:#5f6368}
  .error{color:#d93025;text-align:center;margin-top:16px}
  .loading{text-align:center;color:#5f6368;padding:24px}
  @media (prefers-color-scheme: dark){
    body{background:#202124;color:#e8eaed}
    .card{background:#2d2d2d;box-shadow:0 1px 3px rgba(0,0,0,.3)}
    input[type=text]{background:#3c4043;border-color:#5f6368;color:#e8eaed}
    .day{background:#3c4043}
    .desc,.meta,.forecast h2,.day-low{color:#9aa0a6}
  }
</style>
</head>
<body>
<h1>Weather</h1>
<div class="card" id="app">
  <div class="search">
    <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>
  <div id="content"></div>
</div>
<script>
const API_KEY = '6e89468b731931bf1840348602d87998';
const BASE = 'https://api.openweathermap.org/data/2.5';
const ICON_BASE = 'https://openweathermap.org/img/wn';

const $ = (s, el=document) => el.querySelector(s);

function show(html) { $('#content').innerHTML = html; }
function loading() { show('<div class="loading">Loading…</div>'); }
function error(msg) { show(`<div class="error">${msg}</div>`); }

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function currentHTML(d) {
  const w = d.weather[0];
  return `
    <div class="current">
      <div class="temp">${Math.round(d.main.temp)}°C</div>
      <div class="desc">${w.description}</div>
      <img src="${ICON_BASE}/${w.icon}@2x.png" alt="" style="width:64px;height:64px">
      <div class="meta">
        <span>💧 ${d.main.humidity}%</span>
        <span>💨 ${Math.round(d.wind.speed * 3.6)} km/h</span>
      </div>
    </div>
  `;
}

function forecastHTML(d) {
  const daily = {};
  d.list.forEach(item => {
    const date = new Date(item.dt * 1000).toDateString();
    if (!daily[date]) daily[date] = { max: -Infinity, min: Infinity, icon: item.weather[0].icon, desc: item.weather[0].description };
    daily[date].max = Math.max(daily[date].max, item.main.temp_max);
    daily[date].min = Math.min(daily[date].min, item.main.temp_min);
  });
  const days = Object.entries(daily).slice(0,5);
  return `
    <div class="forecast">
      <h2>5-Day Forecast</h2>
      <div class="days">
        ${days.map(([date, f]) => `
          <div class="day">
            <div class="day-name">${new Date(date).toLocaleDateString(undefined,{weekday:'short'})}</div>
            <img class="day-icon" src="${ICON_BASE}/${f.icon}@2x.png" alt="${f.desc}">
            <div class="day-temp">
              <span class="day-high">${Math.round(f.max)}°</span>
              <span class="day-low">${Math.round(f.min)}°</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function loadWeather(city) {
  loading();
  try {
    const current = await fetchJSON(`${BASE}/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`);
    const forecast = await fetchJSON(`${BASE}/forecast?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`);
    show(currentHTML(current) + forecastHTML(forecast));
    localStorage.setItem('lastCity', city);
  } catch (e) {
    error('City not found. Please try another location.');
  }
}

$('#searchBtn').onclick = () => {
  const city = $('#cityInput').value.trim();
  if (city) loadWeather(city);
};
$('#cityInput').onkeydown = e => e.key === 'Enter' && $('#searchBtn').click();

const last = localStorage.getItem('lastCity');
if (last) { $('#cityInput').value = last; loadWeather(last); }
else show('<div class="loading">Enter a city to get started</div>');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
